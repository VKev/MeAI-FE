name: Deploy MeAI FE to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment to use'
        type: string
        default: production
        required: true

env:
  NODE_VERSION: '20'
  APP_URL: 'https://creator.meai.vkev.me'

permissions:
  contents: read

concurrency:
  group: meai-fe-cloudflare-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ env.APP_URL }}
    env:
      ENV: ${{ secrets.ENV }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        env:
          CLOUDFLARE_SECRETS_FILE: ${{ runner.temp }}/wrangler-secrets.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function parseEnvFile(content) {
            const result = {};

            for (const [index, rawLine] of content.split(/\r?\n/).entries()) {
              let line = rawLine.trim();
              if (!line || line.startsWith('#')) continue;
              if (line.startsWith('export ')) line = line.slice(7).trim();

              const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
              if (!match) {
                throw new Error(`Invalid ENV line ${index + 1}: ${rawLine}`);
              }

              const [, key, rawValue] = match;
              let value = rawValue.trim();

              if (
                (value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))
              ) {
                value = value.slice(1, -1);
              } else {
                value = value.replace(/\s+#.*$/, '').trim();
              }

              result[key] = value
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r');
            }

            return result;
          }

          function appendGithubEnv(values) {
            const lines = [];

            for (const [key, value] of Object.entries(values)) {
              const delimiter = `GITHUB_ENV_${crypto.randomUUID().replace(/-/g, '')}`;
              lines.push(`${key}<<${delimiter}`, value, delimiter);
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          }

          const envContent = process.env.ENV;
          if (!envContent || !envContent.trim()) {
            console.error('Missing required GitHub Environment secret: ENV');
            process.exit(1);
          }

          fs.writeFileSync(
            '.env.production',
            envContent.endsWith('\n') ? envContent : `${envContent}\n`,
            { mode: 0o600 }
          );

          const parsedEnv = parseEnvFile(envContent);

          const required = {
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID,
            VITE_API_URL: parsedEnv.VITE_API_URL,
            VITE_STRIPE_PUBLISHABLE_KEY: parsedEnv.VITE_STRIPE_PUBLISHABLE_KEY,
            VITE_GOOGLE_CLIENT_ID: parsedEnv.VITE_GOOGLE_CLIENT_ID,
            SESSION_EXPIRES_IN_DAYS: parsedEnv.SESSION_EXPIRES_IN_DAYS,
            SESSION_SECRET: parsedEnv.SESSION_SECRET
          };

          const missing = Object.entries(required)
            .filter(([, value]) => !value)
            .map(([key]) => key);

          if (missing.length > 0) {
            console.error(`Missing required GitHub Environment values: ${missing.join(', ')}`);
            process.exit(1);
          }

          appendGithubEnv({
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID
          });

          const excludedWranglerVars = new Set([
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_GLOBAL_API_KEY',
            'CLOUDFLARE_USER_EMAIL',
            'CLOUDFLARE_ZONE_ID',
            'SESSION_SECRET'
          ]);

          const runtimeVars = Object.fromEntries(
            Object.entries(parsedEnv)
              .filter(([key]) => !excludedWranglerVars.has(key))
              .map(([key, value]) => [key, String(value)])
          );

          const wranglerConfig = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          wranglerConfig.vars = runtimeVars;
          wranglerConfig.routes = (wranglerConfig.routes || []).map((route) => {
            if (route && typeof route === 'object' && route.custom_domain) {
              return { ...route, zone_id: process.env.CLOUDFLARE_ZONE_ID };
            }
            return route;
          });
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(wranglerConfig, null, 2)}\n`);

          fs.writeFileSync(
            process.env.CLOUDFLARE_SECRETS_FILE,
            JSON.stringify({ SESSION_SECRET: parsedEnv.SESSION_SECRET })
          );
          NODE

          echo "CLOUDFLARE_SECRETS_FILE=$CLOUDFLARE_SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | grep -v "The build was canceled"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --secrets-file "$CLOUDFLARE_SECRETS_FILE"

      - name: Ensure and verify Cloudflare custom domain
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const net = require('node:net');

          const VERIFY_TIMEOUT_MS = 10 * 60 * 1000;
          const VERIFY_REFRESH_TIMEOUT_MS = 12 * 60 * 1000;
          const VERIFY_INTERVAL_MS = 15 * 1000;
          const FETCH_TIMEOUT_MS = 10 * 1000;
          const DNS_RESOLVERS = [
            {
              name: 'cloudflare',
              url: (hostname, type) =>
                `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(hostname)}&type=${type}`,
              headers: { accept: 'application/dns-json' }
            },
            {
              name: 'google',
              url: (hostname, type) =>
                `https://dns.google/resolve?name=${encodeURIComponent(hostname)}&type=${type}`,
              headers: { accept: 'application/json' }
            }
          ];

          const READY_STATUSES = new Set(['active', 'ready', 'success']);
          const BAD_STATUSES = new Set([
            'blocked',
            'deleted',
            'deleting',
            'error',
            'errored',
            'failed',
            'failure',
            'inactive'
          ]);

          async function cloudflare(path, options = {}) {
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const headers = {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            };

            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            const payload = await response.json().catch(() => ({}));

            if (!response.ok || payload.success === false) {
              const details = payload.errors?.map((error) => error.message).join('; ') || response.statusText;
              throw new Error(`${options.method || 'GET'} ${path} failed: ${details}`);
            }

            return payload;
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          function normalizeStatus(value) {
            return typeof value === 'string' ? value.trim().toLowerCase() : null;
          }

          function collectStatuses(domain) {
            if (!domain) return [];

            return [
              domain.status,
              domain.ssl?.status,
              domain.certificate?.status,
              domain.cert_status,
              domain.certificate_status,
              domain.ownership_verification?.status,
              domain.validation_status
            ]
              .map(normalizeStatus)
              .filter(Boolean);
          }

          function describeDomain(domain) {
            if (!domain) return 'not found';

            return JSON.stringify({
              id: domain.id,
              hostname: domain.hostname,
              service: domain.service,
              environment: domain.environment,
              zone_id: domain.zone_id,
              status: domain.status,
              cert_status: domain.cert_status,
              certificate_status: domain.certificate_status,
              ownership_status: domain.ownership_verification?.status
            });
          }

          function hasBadStatus(domain) {
            return collectStatuses(domain).some((status) => BAD_STATUSES.has(status));
          }

          function hasPendingStatus(domain) {
            const statuses = collectStatuses(domain);
            return statuses.length > 0 && !statuses.some((status) => READY_STATUSES.has(status));
          }

          async function listDomains(accountId) {
            const domains = [];

            for (let page = 1; ; page += 1) {
              const payload = await cloudflare(`/accounts/${accountId}/workers/domains?page=${page}&per_page=100`);
              domains.push(...(payload.result || []));

              const totalPages = payload.result_info?.total_pages || 1;
              if (page >= totalPages) return domains;
            }
          }

          async function findDomain(accountId, hostname) {
            return (await listDomains(accountId)).find((domain) => domain.hostname === hostname);
          }

          async function putDomain(accountId, zoneId, hostname, service, environment) {
            await cloudflare(`/accounts/${accountId}/workers/domains`, {
              method: 'PUT',
              body: JSON.stringify({
                hostname,
                service,
                environment,
                zone_id: zoneId
              })
            });
          }

          async function deleteDomain(accountId, domain) {
            if (!domain?.id) {
              throw new Error(`Cannot recreate ${domain?.hostname || 'custom domain'} because Cloudflare did not return a domain id.`);
            }

            await cloudflare(`/accounts/${accountId}/workers/domains/${domain.id}`, {
              method: 'DELETE'
            });
          }

          async function resolveWithDoh(resolver, hostname, type) {
            const response = await fetch(resolver.url(hostname, type), {
              headers: resolver.headers
            });
            const payload = await response.json().catch(() => ({}));

            if (!response.ok || payload.Status !== 0) {
              throw new Error(`${resolver.name} ${type} lookup failed with status ${payload.Status ?? response.status}`);
            }

            const expectedType = type === 'A' ? 1 : 28;
            return (payload.Answer || [])
              .filter((answer) => answer.type === expectedType && typeof answer.data === 'string')
              .map((answer) => answer.data);
          }

          async function resolveHostname(hostname) {
            const lookups = DNS_RESOLVERS.flatMap((resolver) =>
              ['A', 'AAAA'].map((type) => resolveWithDoh(resolver, hostname, type))
            );
            const results = await Promise.allSettled(lookups);

            const addresses = [
              ...new Set(
                results
                  .filter((result) => result.status === 'fulfilled')
                  .flatMap((result) => result.value)
                  .filter((address) => net.isIP(address) !== 0)
              )
            ];

            if (addresses.length === 0) {
              const errors = results
                .filter((result) => result.status === 'rejected')
                .map((result) => result.reason?.message)
                .filter(Boolean)
                .join(', ');
              throw new Error(`DNS for ${hostname} has no A/AAAA records yet${errors ? ` (${errors})` : ''}.`);
            }

            return addresses;
          }

          async function fetchHttpsStatus(hostname, addresses) {
            const address = addresses.find((item) => net.isIP(item) === 4) || addresses[0];
            const family = net.isIP(address);

            return await new Promise((resolve, reject) => {
              const request = https.request(
                {
                  host: address,
                  servername: hostname,
                  family,
                  port: 443,
                  method: 'HEAD',
                  path: '/',
                  headers: {
                    host: hostname,
                    'user-agent': 'meai-fe-cloudflare-domain-verifier'
                  },
                  timeout: FETCH_TIMEOUT_MS
                },
                (response) => {
                  response.resume();
                  if ((response.statusCode || 0) >= 500) {
                    reject(new Error(`HTTPS returned ${response.statusCode}.`));
                    return;
                  }

                  resolve(response.statusCode || 0);
                }
              );

              request.on('timeout', () => {
                request.destroy(new Error(`HTTPS timed out after ${FETCH_TIMEOUT_MS}ms.`));
              });
              request.on('error', reject);
              request.end();
            });
          }

          async function ensureDomain(accountId, zoneId, hostname, service, environment) {
            const existing = await findDomain(accountId, hostname);

            if (!existing) {
              console.log(`Creating Worker custom domain: ${hostname} -> ${service}`);
              await putDomain(accountId, zoneId, hostname, service, environment);
              return;
            }

            console.log(`Existing Worker custom domain: ${describeDomain(existing)}`);

            if (hasBadStatus(existing)) {
              console.log(`Existing custom domain has a failed status; recreating ${hostname}.`);
              await deleteDomain(accountId, existing);
              await sleep(5000);
              await putDomain(accountId, zoneId, hostname, service, environment);
              return;
            }

            if (existing.service && existing.service !== service) {
              console.log(`Updating ${hostname} from Worker ${existing.service} to ${service}.`);
              await putDomain(accountId, zoneId, hostname, service, environment);
              return;
            }

            console.log(`Worker custom domain mapping is present: ${hostname} -> ${service}`);
          }

          async function verifyDomain(accountId, hostname, service, timeoutMs) {
            const startedAt = Date.now();
            let attempt = 0;
            let lastError = null;

            while (Date.now() - startedAt < timeoutMs) {
              attempt += 1;

              try {
                const domain = await findDomain(accountId, hostname);
                if (!domain) {
                  throw new Error('Worker custom domain is not listed by Cloudflare yet.');
                }

                if (domain.service && domain.service !== service) {
                  throw new Error(`Worker custom domain points to ${domain.service}, expected ${service}.`);
                }

                if (hasBadStatus(domain)) {
                  throw new Error(`Worker custom domain has failed status: ${describeDomain(domain)}`);
                }

                if (hasPendingStatus(domain)) {
                  throw new Error(`Worker custom domain is not active yet: ${describeDomain(domain)}`);
                }

                const addresses = await resolveHostname(hostname);
                const httpsStatus = await fetchHttpsStatus(hostname, addresses);

                console.log(
                  `Cloudflare custom domain ready: ${hostname} (${addresses.join(', ')}) HTTPS ${httpsStatus}`
                );
                return;
              } catch (error) {
                lastError = error;
                console.log(
                  `Waiting for ${hostname} to become ready ` +
                    `(attempt ${attempt}, ${Math.round((Date.now() - startedAt) / 1000)}s): ${error.message}`
                );
                await sleep(VERIFY_INTERVAL_MS);
              }
            }

            throw lastError || new Error(`Timed out waiting for ${hostname} to become ready.`);
          }

          async function refreshAndVerifyDomain(accountId, zoneId, hostname, service, environment, originalError) {
            console.log(`Initial custom-domain verification failed: ${originalError.message}`);
            console.log(`Re-applying ${hostname} once to refresh Cloudflare DNS/TLS/custom-domain state.`);

            const existing = await findDomain(accountId, hostname);
            if (existing && hasBadStatus(existing)) {
              console.log(`Existing custom domain has a failed status during refresh; recreating ${hostname}.`);
              await deleteDomain(accountId, existing);
              await sleep(5000);
            }

            await putDomain(accountId, zoneId, hostname, service, environment);
            await verifyDomain(accountId, hostname, service, VERIFY_REFRESH_TIMEOUT_MS);
          }

          async function main() {
            const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
            const route = (config.routes || []).find((item) => item && typeof item === 'object' && item.custom_domain);
            const hostname = route?.pattern;
            const service = config.name;
            const environment = 'production';

            const required = {
              CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
              CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
              CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID,
              WORKER_SERVICE: service,
              WORKER_CUSTOM_DOMAIN: hostname
            };

            const missing = Object.entries(required)
              .filter(([, value]) => !value)
              .map(([key]) => key);

            if (missing.length > 0) {
              throw new Error(`Missing required values for custom domain setup: ${missing.join(', ')}`);
            }

            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const zoneId = process.env.CLOUDFLARE_ZONE_ID;

            await ensureDomain(accountId, zoneId, hostname, service, environment);

            try {
              await verifyDomain(accountId, hostname, service, VERIFY_TIMEOUT_MS);
            } catch (error) {
              await refreshAndVerifyDomain(accountId, zoneId, hostname, service, environment, error);
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
