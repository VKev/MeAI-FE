name: Deploy Editor FE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to use
        type: string
        default: production
        required: true
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to use
        type: string
        default: production
        required: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.5.0'
  APP_NAME: meai-editor-fe
  APP_DIR: apps/meai-editor-fe
  WORKER_NAME: meai-editor
  APP_HOSTNAME: editor.meaiplatform.io.vn
  APP_URL: https://editor.meaiplatform.io.vn/editor

permissions:
  contents: read

concurrency:
  group: meai-editor-fe-${{ inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Editor FE
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ env.APP_URL }}
    env:
      EDITOR_ENV: ${{ secrets.EDITOR_ENV }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Editor environment
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function stripJsonc(input) {
            return input
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/(^|[^:])\/\/.*$/gm, '$1')
              .replace(/,\s*([}\]])/g, '$1');
          }

          const missing = [];
          if (!process.env.CLOUDFLARE_API_TOKEN) missing.push('CLOUDFLARE_API_TOKEN');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID) missing.push('CLOUDFLARE_ACCOUNT_ID');
          if (!process.env.CLOUDFLARE_ZONE_ID) missing.push('CLOUDFLARE_ZONE_ID');
          if (missing.length) throw new Error(`Missing required values: ${missing.join(', ')}`);

          const envContent = process.env.EDITOR_ENV;
          if (envContent && envContent.trim()) {
            const envPath = path.join(process.env.APP_DIR, '.env.production');
            fs.writeFileSync(envPath, envContent.endsWith('\n') ? envContent : `${envContent}\n`, { mode: 0o600 });
          }

          const viteConfig = fs.readFileSync(path.join(process.env.APP_DIR, 'vite.config.ts'), 'utf8');
          if (!viteConfig.includes("base: '/editor'") && !viteConfig.includes('base: "/editor"')) {
            throw new Error('Editor Vite config must build with base: /editor');
          }

          const wranglerPath = path.join(process.env.APP_DIR, 'wrangler.jsonc');
          const wranglerConfig = JSON.parse(stripJsonc(fs.readFileSync(wranglerPath, 'utf8')));
          if (wranglerConfig.name !== process.env.WORKER_NAME) {
            throw new Error(`wrangler.jsonc name must be ${process.env.WORKER_NAME}, got ${wranglerConfig.name}`);
          }
          if (!wranglerConfig.main) {
            throw new Error('Editor wrangler.jsonc must include a Worker main entrypoint.');
          }
          if (!wranglerConfig.assets || wranglerConfig.assets.directory !== './dist' || wranglerConfig.assets.binding !== 'ASSETS') {
            throw new Error('Editor wrangler.jsonc must bind ./dist assets as ASSETS.');
          }
          const customDomainRoute = (wranglerConfig.routes || []).find((route) => route && typeof route === 'object' && route.custom_domain);
          if (!customDomainRoute || customDomainRoute.pattern !== process.env.APP_HOSTNAME) {
            throw new Error(`wrangler.jsonc custom domain must be ${process.env.APP_HOSTNAME}`);
          }
          wranglerConfig.routes = (wranglerConfig.routes || []).map((route) =>
            route && typeof route === 'object' && route.custom_domain
              ? { ...route, zone_id: process.env.CLOUDFLARE_ZONE_ID }
              : route
          );
          fs.writeFileSync(wranglerPath, `${JSON.stringify(wranglerConfig, null, 2)}\n`);

          const redirectsPath = path.join(process.env.APP_DIR, 'public', '_redirects');
          const redirects = fs.readFileSync(redirectsPath, 'utf8');
          for (const requiredRule of ['/editor/assets/* /assets/:splat 200', '/editor/* /index.html 200']) {
            if (!redirects.includes(requiredRule)) {
              throw new Error(`Missing required Pages redirect rule: ${requiredRule}`);
            }
          }
          NODE

      - name: Build Editor FE
        run: pnpm --filter $APP_NAME build

      - name: Verify Editor build paths
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const distDir = path.join(process.env.APP_DIR, 'dist');
          const indexHtml = fs.readFileSync(path.join(distDir, 'index.html'), 'utf8');
          const redirects = fs.readFileSync(path.join(distDir, '_redirects'), 'utf8');

          if (!indexHtml.includes('/editor/assets/')) {
            throw new Error('Editor build did not emit /editor asset URLs.');
          }
          if (!redirects.includes('/editor/assets/* /assets/:splat 200')) {
            throw new Error('Editor build is missing /editor asset rewrite rule.');
          }
          NODE

      - name: Deploy Editor FE to Cloudflare Worker
        run: pnpm --filter $APP_NAME exec wrangler deploy --config wrangler.jsonc

      - name: Verify Cloudflare Worker mapping
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const workerName = process.env.WORKER_NAME;
          const hostname = process.env.APP_HOSTNAME;

          async function cloudflare(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: {
                authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'content-type': 'application/json'
              }
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              throw new Error(`Cloudflare API failed ${path}: ${JSON.stringify(payload.errors || payload)}`);
            }
            return payload.result;
          }

          const scripts = await cloudflare(`/accounts/${accountId}/workers/scripts`);
          if (!scripts.some((script) => script.id === workerName)) {
            throw new Error(`Cloudflare Worker ${workerName} was not found.`);
          }

          const domains = await cloudflare(`/accounts/${accountId}/workers/domains?page=1&per_page=100`);
          const domain = domains.find((item) => item.hostname === hostname);
          if (!domain) {
            throw new Error(`Cloudflare Worker custom domain ${hostname} was not found.`);
          }
          if (domain.service !== workerName) {
            throw new Error(`Cloudflare Worker custom domain ${hostname} points to ${domain.service}, expected ${workerName}.`);
          }

          console.log(`Cloudflare mapping verified: ${hostname} -> ${workerName}`);
          NODE
